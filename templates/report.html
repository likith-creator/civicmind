<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report Issue - CivicMind</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        nav {
            background: #0d47a1;

            padding: 17px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            color: white;

            font-size: 24px;

            font-weight: bold;
        }


        nav div:last-child {
            display: flex;

            align-items: center;

            gap: 26px;
        }


        nav a {
            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }


        nav a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {

            width: 90%;

            max-width: 850px;

            margin: 35px auto 50px;

            background: white;

            padding: 35px 40px;

            border: 1px solid #d9dee7;

            border-radius: 6px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.05);
        }


        h1 {

            text-align: center;

            color: #0645a5;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 30px;
        }


        /* =====================================================
           USER INFORMATION
        ===================================================== */

        .user-info {

            background: #eef5ff;

            border-left: 4px solid #0d47a1;

            padding: 15px 16px;

            border-radius: 4px;

            margin-bottom: 28px;
        }


        .user-info strong {

            display: block;

            color: #0645a5;

            font-size: 14px;

            margin-bottom: 8px;
        }


        .user-info div {

            margin-top: 5px;

            color: #555;

            font-size: 13px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        label {

            display: block;

            margin-top: 21px;

            margin-bottom: 8px;

            color: #111;

            font-size: 16px;

            font-weight: 700;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 4px;

            background: white;

            color: #222;

            font-family: Arial, sans-serif;

            font-size: 15px;

            outline: none;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #1554ad;

            box-shadow:
                0 0 0 2px rgba(
                    21,
                    84,
                    173,
                    0.08
                );
        }


        textarea {

            height: 120px;

            resize: vertical;
        }


        /* =====================================================
           OPTION BUTTONS
        ===================================================== */

        .option-group {

            display: flex;

            gap: 12px;

            margin-top: 10px;
        }


        .option-btn {

            flex: 1;

            padding: 13px;

            border: 1px solid #cbd5e1;

            background: white;

            color: #333;

            border-radius: 4px;

            cursor: pointer;

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: 700;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }


        .option-btn:hover {

            border-color: #1554ad;

            background: #f7faff;
        }


        .option-btn.active {

            border-color: #1554ad;

            background: #eaf2ff;

            color: #0645a5;
        }


        /* =====================================================
           LOCATION
        ===================================================== */

        .location-section {

            margin-top: 14px;
        }


        #locationDisplay {

            background: #f5f7fa;

            border: 1px solid #e1e5eb;

            padding: 12px;

            border-radius: 4px;

            margin-top: 12px;

            color: #444;

            min-height: 45px;

            font-size: 13px;

            line-height: 1.5;
        }


        #map {

            height: 350px;

            margin-top: 14px;

            border-radius: 5px;

            border: 1px solid #d9dee7;

            display: none;
        }


        .location-btn {

            background: #2e7d32 !important;

            color: white !important;

            border-color: #2e7d32 !important;
        }


        /* =====================================================
           INFORMATION TEXT
        ===================================================== */

        .info {

            margin-top: 7px;

            font-size: 12px;

            color: #777;

            line-height: 1.5;
        }


        /* =====================================================
           IMAGE
        ===================================================== */

        .image-section {

            margin-top: 14px;
        }


        /* =====================================================
           CAMERA
        ===================================================== */

        #cameraContainer {

            display: none;

            margin-top: 15px;

            text-align: center;

            border: 1px solid #d9dee7;

            padding: 15px;

            border-radius: 5px;

            background: #f8fafc;
        }


        #camera {

            width: 100%;

            max-height: 450px;

            border-radius: 5px;

            background: black;

            display: block;
        }


        #canvas {

            display: none;
        }


        #preview {

            display: none;

            width: 100%;

            max-height: 450px;

            object-fit: contain;

            margin-top: 15px;

            border-radius: 5px;
        }


        #captureBtn {

            background: #2e7d32;
        }


        #retakeBtn {

            background: #ef6c00;

            display: none;
        }


        /* =====================================================
           GENERAL BUTTON
        ===================================================== */

        .button {

            margin-top: 15px;

            padding: 11px 18px;

            border: none;

            border-radius: 4px;

            background: #0d47a1;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }


        .button:hover {

            opacity: 0.92;
        }


        /* =====================================================
           SUBMIT
        ===================================================== */

        .submit-btn {

            width: 100%;

            margin-top: 30px;

            padding: 15px;

            font-size: 17px;

            background: #0d47a1;
        }


        /* =====================================================
           SMALL HINT
        ===================================================== */

        .form-note {

            margin-top: 6px;

            color: #777;

            font-size: 12px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 650px) {

            nav {

                padding: 15px 20px;

                flex-direction: column;

                gap: 12px;
            }


            nav div:last-child {

                gap: 16px;

                flex-wrap: wrap;

                justify-content: center;
            }


            .container {

                width: 94%;

                padding: 25px 20px;

                margin-top: 25px;
            }


            h1 {

                font-size: 25px;
            }


            .option-group {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav>

    <div class="logo">
        CivicMind
    </div>


    <div>

        <a href="/">
            Home
        </a>

        <a href="/report">
            Report
        </a>

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">


    <h1>
        Report a Community Issue
    </h1>



    <!-- =================================================
         USER
    ================================================== -->

    <div class="user-info">

        <strong>
            👤 Reporting as
        </strong>


        <div>
            {{ user_name }}
        </div>


        <div>
            {{ user_email }}
        </div>

    </div>



    <!-- =================================================
         FORM
    ================================================== -->

    <form action="/report"
          method="POST"
          enctype="multipart/form-data"
          id="reportForm">


        <!-- =================================================
             ISSUE TYPE
        ================================================== -->

        <label for="issue">
            Issue Type
        </label>


        <select id="issue"
                name="issue"
                required>

            <option value="">
                Select an issue
            </option>

            <option value="Pothole">
                Pothole
            </option>

            <option value="Water Leakage">
                Water Leakage
            </option>

            <option value="Street Light">
                Street Light
            </option>

            <option value="Garbage">
                Garbage
            </option>

        </select>



        <!-- =================================================
             DESCRIPTION
        ================================================== -->

        <label for="description">
            Description
        </label>


        <textarea id="description"
                  name="description"
                  placeholder="Describe the issue..."
                  required></textarea>



        <!-- =================================================
             LOCATION
        ================================================== -->

        <label>
            Location
        </label>


        <div class="option-group">


            <button type="button"
                    id="detectLocationBtn"
                    class="option-btn active"
                    onclick="selectLocationMode('auto')">

                📍 Detect My Location

            </button>


            <button type="button"
                    id="manualLocationBtn"
                    class="option-btn"
                    onclick="selectLocationMode('manual')">

                ✍️ Enter Address Manually

            </button>


        </div>



        <!-- =================================================
             AUTOMATIC LOCATION
        ================================================== -->

        <div id="autoLocation"
             class="location-section">


            <button type="button"
                    class="button location-btn"
                    onclick="getLocation()">

                📍 Get My Current Location

            </button>


            <div id="locationDisplay">

                Your detected location will appear here.

            </div>


            <div id="map"></div>

        </div>



        <!-- =================================================
             MANUAL LOCATION
        ================================================== -->

        <div id="manualLocation"
             class="location-section"
             style="display: none;">


            <input type="text"
                   id="manualAddress"
                   placeholder="Enter the complete address">


            <p class="info">

                Example:
                Near Benz Circle, Vijayawada, Andhra Pradesh

            </p>

        </div>



        <!-- =================================================
             HIDDEN LOCATION DATA
        ================================================== -->

        <input type="hidden"
               id="location"
               name="location"
               required>


        <input type="hidden"
               id="latitude"
               name="latitude">


        <input type="hidden"
               id="longitude"
               name="longitude">



        <!-- =================================================
             IMAGE
        ================================================== -->

        <label>
            Issue Image
        </label>


        <div class="option-group">


            <button type="button"
                    id="uploadImageBtn"
                    class="option-btn active"
                    onclick="selectImageMode('upload')">

                📁 Upload Image

            </button>


            <button type="button"
                    id="captureImageBtn"
                    class="option-btn"
                    onclick="selectImageMode('camera')">

                📷 Capture Image

            </button>


        </div>



        <!-- =================================================
             UPLOAD
        ================================================== -->

        <div id="uploadSection"
             class="image-section">


            <input type="file"
                   id="image"
                   name="image"
                   accept="image/*">


            <p class="info">

                Select an existing image of the issue.

            </p>

        </div>



        <!-- =================================================
             CAMERA
        ================================================== -->

        <div id="cameraContainer">


            <video id="camera"
                   autoplay
                   playsinline>
            </video>


            <button type="button"
                    id="captureBtn"
                    class="button"
                    onclick="captureImage()">

                📸 Take Photo

            </button>


            <button type="button"
                    id="retakeBtn"
                    class="button"
                    onclick="startCamera()">

                🔄 Retake Photo

            </button>


            <canvas id="canvas"></canvas>


            <img id="preview"
                 alt="Captured image preview">

        </div>



        <!-- =================================================
             SUBMIT
        ================================================== -->

        <button type="submit"
                class="button submit-btn">

            🚀 Submit Report

        </button>


    </form>

</div>



<!-- =====================================================
     LEAFLET
===================================================== -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script>


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let map = null;

let marker = null;

let cameraStream = null;



/* =====================================================
   LOCATION MODE
===================================================== */

function selectLocationMode(mode) {


    const autoSection =
        document.getElementById("autoLocation");


    const manualSection =
        document.getElementById("manualLocation");


    const autoBtn =
        document.getElementById("detectLocationBtn");


    const manualBtn =
        document.getElementById("manualLocationBtn");


    const locationInput =
        document.getElementById("location");


    const manualAddress =
        document.getElementById("manualAddress");


    if (mode === "auto") {


        autoSection.style.display =
            "block";


        manualSection.style.display =
            "none";


        autoBtn.classList.add("active");

        manualBtn.classList.remove("active");


        manualAddress.required =
            false;


        locationInput.required =
            true;

    }


    else {


        autoSection.style.display =
            "none";


        manualSection.style.display =
            "block";


        autoBtn.classList.remove("active");

        manualBtn.classList.add("active");


        manualAddress.required =
            true;


        locationInput.required =
            true;


        locationInput.value =
            manualAddress.value;

    }

}



/* =====================================================
   GET CURRENT LOCATION
===================================================== */

function getLocation() {


    if (!navigator.geolocation) {

        alert(
            "Geolocation is not supported by your browser."
        );

        return;

    }


    const display =
        document.getElementById(
            "locationDisplay"
        );


    display.innerText =
        "📍 Detecting your location...";


    navigator.geolocation.getCurrentPosition(

        async function(position) {


            const lat =
                position.coords.latitude;


            const lon =
                position.coords.longitude;



            /*
             * Store coordinates separately.
             */

            document.getElementById(
                "latitude"
            ).value = lat;


            document.getElementById(
                "longitude"
            ).value = lon;


            /*
             * Initially store coordinates
             * as the location.
             */

            document.getElementById(
                "location"
            ).value =
                `${lat}, ${lon}`;


            display.innerText =
                "📍 Location detected. Getting address...";



            /* =========================================
               REVERSE GEOCODING
            ========================================= */

            try {


                const response =
                    await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`
                    );


                const data =
                    await response.json();


                const address =
                    data.display_name ||
                    `${lat}, ${lon}`;


                document.getElementById(
                    "location"
                ).value =
                    address;


                display.innerText =
                    "📍 " + address;

            }


            catch (error) {


                document.getElementById(
                    "locationDisplay"
                ).innerText =
                    `📍 ${lat}, ${lon}`;

            }



            /* =========================================
               CREATE MAP
            ========================================= */

            if (!map) {


                map =
                    L.map("map").setView(
                        [lat, lon],
                        17
                    );


                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {
                        attribution:
                            "&copy; OpenStreetMap contributors"
                    }
                ).addTo(map);


                marker =
                    L.marker(
                        [lat, lon],
                        {
                            draggable: true
                        }
                    ).addTo(map);



                /* =====================================
                   MARKER DRAG
                ===================================== */

                marker.on(
                    "dragend",
                    async function(event) {


                        const pos =
                            event.target.getLatLng();


                        const newLat =
                            pos.lat;


                        const newLon =
                            pos.lng;



                        document.getElementById(
                            "latitude"
                        ).value =
                            newLat;


                        document.getElementById(
                            "longitude"
                        ).value =
                            newLon;


                        document.getElementById(
                            "location"
                        ).value =
                            `${newLat}, ${newLon}`;


                        document.getElementById(
                            "locationDisplay"
                        ).innerText =
                            `📍 ${newLat}, ${newLon}`;



                        try {


                            const response =
                                await fetch(
                                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${newLat}&lon=${newLon}&zoom=18&addressdetails=1`
                                );


                            const data =
                                await response.json();


                            const address =
                                data.display_name;


                            if (address) {


                                document.getElementById(
                                    "location"
                                ).value =
                                    address;


                                document.getElementById(
                                    "locationDisplay"
                                ).innerText =
                                    "📍 " + address;

                            }

                        }


                        catch (error) {

                            console.log(
                                "Could not get address."
                            );

                        }

                    }
                );

            }


            else {


                map.setView(
                    [lat, lon],
                    17
                );


                marker.setLatLng(
                    [lat, lon]
                );

            }



            /* =========================================
               SHOW MAP
            ========================================= */

            document.getElementById(
                "map"
            ).style.display =
                "block";


            setTimeout(
                function() {

                    map.invalidateSize();

                },
                100
            );

        },


        function(error) {


            document.getElementById(
                "locationDisplay"
            ).innerText =
                "Unable to detect your location.";


            alert(
                "Location permission was denied or your location could not be detected. You can enter the address manually."
            );

        },


        {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0

        }

    );

}



/* =====================================================
   MANUAL ADDRESS
===================================================== */

document.getElementById(
    "manualAddress"
).addEventListener(
    "input",
    function() {


        document.getElementById(
            "location"
        ).value =
            this.value;


    }
);



/* =====================================================
   IMAGE MODE
===================================================== */

function selectImageMode(mode) {


    const uploadSection =
        document.getElementById(
            "uploadSection"
        );


    const cameraContainer =
        document.getElementById(
            "cameraContainer"
        );


    const uploadBtn =
        document.getElementById(
            "uploadImageBtn"
        );


    const cameraBtn =
        document.getElementById(
            "captureImageBtn"
        );


    const imageInput =
        document.getElementById(
            "image"
        );


    if (mode === "upload") {


        uploadSection.style.display =
            "block";


        cameraContainer.style.display =
            "none";


        uploadBtn.classList.add(
            "active"
        );


        cameraBtn.classList.remove(
            "active"
        );


        imageInput.required =
            true;


        stopCamera();

    }


    else {


        uploadSection.style.display =
            "none";


        cameraContainer.style.display =
            "block";


        uploadBtn.classList.remove(
            "active"
        );


        cameraBtn.classList.add(
            "active"
        );


        imageInput.required =
            true;


        startCamera();

    }

}



/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {


    const video =
        document.getElementById(
            "camera"
        );


    try {


        stopCamera();


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "environment"
                        }

                    },

                    audio: false

                });


        video.srcObject =
            cameraStream;


        document.getElementById(
            "preview"
        ).style.display =
            "none";


        document.getElementById(
            "captureBtn"
        ).style.display =
            "inline-block";


        document.getElementById(
            "retakeBtn"
        ).style.display =
            "none";

    }


    catch (error) {


        console.error(error);


        alert(
            "Camera access was denied or the camera is not available."
        );

    }

}



/* =====================================================
   CAPTURE IMAGE
===================================================== */

function captureImage() {


    const video =
        document.getElementById(
            "camera"
        );


    const canvas =
        document.getElementById(
            "canvas"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
    ) {


        alert(
            "Camera is not ready yet. Please wait a moment."
        );


        return;

    }



    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const context =
        canvas.getContext(
            "2d"
        );


    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const imageData =
        canvas.toDataURL(
            "image/jpeg",
            0.9
        );


    preview.src =
        imageData;


    preview.style.display =
        "block";



    canvas.toBlob(
        function(blob) {


            if (!blob) {


                alert(
                    "Could not capture image."
                );


                return;

            }


            const file =
                new File(
                    [blob],
                    "captured_issue.jpg",
                    {
                        type: "image/jpeg"
                    }
                );


            const dataTransfer =
                new DataTransfer();


            dataTransfer.items.add(
                file
            );


            document.getElementById(
                "image"
            ).files =
                dataTransfer.files;


        },
        "image/jpeg",
        0.9
    );


    document.getElementById(
        "captureBtn"
    ).style.display =
        "none";


    document.getElementById(
        "retakeBtn"
    ).style.display =
        "inline-block";


    stopCamera();

}



/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {


    if (cameraStream) {


        cameraStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        cameraStream = null;

    }

}



/* =====================================================
   FORM VALIDATION
===================================================== */

document.getElementById(
    "reportForm"
).addEventListener(
    "submit",
    function(event) {


        const location =
            document.getElementById(
                "location"
            ).value.trim();


        const image =
            document.getElementById(
                "image"
            );


        if (!location) {


            event.preventDefault();


            alert(
                "Please detect your location or enter an address."
            );


            return;

        }


        if (
            !image.files ||
            image.files.length === 0
        ) {


            event.preventDefault();


            alert(
                "Please upload an image or capture one using the camera."
            );


            return;

        }

    }
);



/* =====================================================
   STOP CAMERA WHEN LEAVING
===================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        stopCamera();

    }
);

</script>


</body>

</html>
