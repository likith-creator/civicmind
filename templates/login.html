<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CivicMind AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        nav {
            background: #0d47a1;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #0d47a1;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            background: #ffe0e0;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
        }

        .bottom-text a {
            color: #0d47a1;
        }

    </style>

</head>

<body>

<nav>

    <div class="logo">
        CivicMind AI
    </div>

    <div>

        <a href="/">Home</a>
        <a href="/register">Register</a>

    </div>

</nav>


<div class="container">

    <h1>Login</h1>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">

        <label for="email">
            Email
        </label>

        <input type="email"
               id="email"
               name="email"
               required>


        <label for="password">
            Password
        </label>

        <input type="password"
               id="password"
               name="password"
               required>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="bottom-text">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </div>

</div>

</body>

</html>
